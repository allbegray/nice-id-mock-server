services:
  nice-id-mock-server:
    build: .
    image: nice-id-mock-server:local
    container_name: nice-id-mock-server
    # NOTE: a PORT override keeps the container healthy (shell-form HEALTHCHECK
    # reads $PORT) but the host mapping below must be changed to match.
    ports:
      - "8899:8899"
    environment:
      - "PUBLIC_BASE_URL=http://localhost:8899"
      - "CLIENT_ID=test-client-id"
      - "CLIENT_SECRET=test-client-secret"
      - "ITERATORS=66"
      - "STRICT_ONE_TIME_RESULT=false"
      - "DB_PATH=/app/data/niceid.db"
    # NOTE: the ./data bind mount preserves sqlite data across container recreation (down/up).
    volumes:
      - ./data:/app/data
    restart: unless-stopped
